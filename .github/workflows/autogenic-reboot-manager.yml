name: Autogenic Reboot Manager

on:
  push:
    branches:
      - chatgpt/autogenic-runtime-v0
    paths:
      - 'autogenic-runtime/reboot-manager/**'
      - 'autogenic-runtime/tests/test_reboot_manager.py'
      - 'autogenic-runtime/tests/test_browser_bridge.py'
      - 'autogenic-runtime/tests/test_browser_roots.py'
      - '.github/workflows/autogenic-reboot-manager.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python compile
        run: |
          python -m py_compile autogenic-runtime/reboot-manager/tf_reboot_manager.py
          python -m py_compile autogenic-runtime/reboot-manager/browser_bridge.py
          python -m py_compile autogenic-runtime/reboot-manager/browser_roots.py
          python -m py_compile autogenic-runtime/reboot-manager/reboot_supervisor.py
          python -m py_compile autogenic-runtime/tests/test_reboot_manager.py
          python -m py_compile autogenic-runtime/tests/test_browser_bridge.py
          python -m py_compile autogenic-runtime/tests/test_browser_roots.py
      - name: JavaScript syntax
        run: |
          node --check autogenic-runtime/reboot-manager/reboot_cdp.mjs
          node --check autogenic-runtime/reboot-manager/extension_bridge/reboot_bridge.js
      - name: Legacy-manager regression test
        run: python autogenic-runtime/tests/test_reboot_manager.py
      - name: Browser bridge protocol test
        run: python autogenic-runtime/tests/test_browser_bridge.py
      - name: Browser root coverage gate test
        run: python autogenic-runtime/tests/test_browser_roots.py
      - name: Strict supervisor self-test
        run: python autogenic-runtime/reboot-manager/reboot_supervisor.py --self-test
