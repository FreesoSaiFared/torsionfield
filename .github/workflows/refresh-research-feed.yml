name: Refresh research feeds and prepare editorial review
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate source research feeds
        run: python tools/update_research_feed.py
      - name: Commit only a changed source snapshot
        run: |
          if git diff --quiet -- public/research-feed.json; then exit 0; fi
          git config user.name 'torsionfield-research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add public/research-feed.json
          git commit -m 'data: refresh attributed security research sources'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Queue research that still needs first-party interpretation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/editorial_backlog.py --github-issue --output .runtime/editorial-backlog.json
