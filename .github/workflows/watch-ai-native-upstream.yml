name: Track upstream AI-native engineering research
on:
  schedule:
    - cron: '8,38 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: ai-native-upstream-watch
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify ingestion and evidence audit contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check upstream SHA and record relevant changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/watch_hitchhikers.py --receipt .runtime/hitchhikers-receipt.json
      - name: Ground selected claims in primary AISI and Willison sources
        continue-on-error: true
        run: python3 tools/verify_research_claims.py
      - name: Commit changed metadata and evidence flags, never upstream article bodies
        run: |
          if git diff --quiet -- public/research/hitchhikers-upstream.json public/research/evidence-audit.json; then
            echo 'No upstream change; no commit'
            exit 0
          fi
          git config user.name torsionfield-research-bot
          git config user.email research-bot@users.noreply.github.com
          git add public/research/hitchhikers-upstream.json public/research/evidence-audit.json
          git commit -m 'data: update source watch and bounded evidence audit'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Create a review issue for high-priority changes
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          receipt=json.loads(pathlib.Path('.runtime/hitchhikers-receipt.json').read_text())
          if receipt['status']=='unchanged' or not receipt['reviewNeeded']:
              raise SystemExit(0)
          doc=json.loads(pathlib.Path('public/research/hitchhikers-upstream.json').read_text())
          sha=doc['upstreamSha']
          marker='Hitchhiker research audit '+sha[:12]
          candidates=[x for x in doc['changed'] if x['priority']>=90]
          body='Upstream: '+doc['upstreamUrl']+'/commit/'+sha+'\n\n'
          body+='Evidence review required; source metadata is not a verified Torsionfield claim.\n\n'
          for item in candidates[:12]:
              body+='- '+item['path']+' — '+item['url']+'\n'
          body+='\nCheck primary evidence and re-evaluate two known extraction cautions:\n'
          for finding in doc['auditFindings']:
              body+='- '+finding['finding']+' ('+finding['primarySource']+')\n'
          out=subprocess.check_output(
              ['gh','issue','list','--state','all','--search',marker+' in:title','--json','title'],text=True)
          if any(marker in x['title'] for x in json.loads(out)):
              raise SystemExit(0)
          subprocess.run(['gh','issue','create','--title',marker,'--body',body],check=True)
          PY
