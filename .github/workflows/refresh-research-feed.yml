name: Refresh attributed research feed
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate Trail of Bits RSS
        run: python tools/update_research_feed.py
      - name: Commit only a changed snapshot
        run: |
          if git diff --quiet -- public/research-feed.json; then exit 0; fi
          git config user.name 'torsionfield-research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add public/research-feed.json
          git commit -m 'data: refresh attributed Trail of Bits research snapshot'
          git push
