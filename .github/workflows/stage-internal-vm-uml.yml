name: stage-internal-vm-uml
on:
  push:
    paths:
      - '.github/workflows/stage-internal-vm-uml.yml'
      - '.github/internal-vm-uml-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - id: build
        name: Build and prove pinned UML capsule
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee build.log) 2>&1
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc libssl-dev libelf-dev busybox-static e2fsprogs
          git clone --depth 1 --branch v6.12.96 https://github.com/torvalds/linux.git linux
          cd linux
          PINNED_COMMIT="$(git rev-parse HEAD)"
          mkdir -p uml-root/{bin,dev,proc,sys,mnt,tmp}
          cp /bin/busybox uml-root/bin/busybox
          cat > uml-root/init <<'EOF'
          #!/bin/busybox sh
          set -eu
          /bin/busybox --install -s /bin
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          mkdir -p /mnt
          echo "UML_GUEST_KERNEL=$(uname -srmo)"
          echo "UML_GUEST_PID1=$$"
          mount -t ext4 /dev/ubda /mnt
          if [ -f /mnt/sentinel ]; then
            echo "SENTINEL_BEFORE=$(cat /mnt/sentinel)"
          else
            echo "SENTINEL_BEFORE=ABSENT"
          fi
          echo written-by-uml > /mnt/sentinel
          sync
          echo "SENTINEL_AFTER=$(cat /mnt/sentinel)"
          umount /mnt
          sync
          echo UML_TEST_COMPLETE=1
          poweroff -f
          EOF
          chmod +x uml-root/init
          make ARCH=um defconfig
          scripts/config --enable BLK_DEV_UBD
          scripts/config --enable EXT4_FS
          scripts/config --enable DEVTMPFS
          scripts/config --enable DEVTMPFS_MOUNT
          scripts/config --enable TMPFS
          scripts/config --disable HOSTFS
          scripts/config --disable MODULES
          scripts/config --set-str INITRAMFS_SOURCE uml-root
          make ARCH=um olddefconfig
          make -j2 ARCH=um linux
          cd ..
          cp linux/linux linux-uml
          strip --strip-debug linux-uml || true
          mkdir -p seed proof bundle
          echo pristine-master > seed/baseline.txt
          truncate -s 32M master.img
          mkfs.ext4 -q -d seed master.img
          sha256sum master.img | tee proof/master-before.sha256
          run_uml() {
            local cow="$1" log="$2"
            set +e
            timeout 60s ./linux-uml mem=128M "ubd0=${cow},master.img" init=/init con=null con0=fd:0,fd:1 >"$log" 2>&1
            rc=$?
            set -e
            echo "uml_exit=$rc" >>"$log"
            grep -q UML_TEST_COMPLETE=1 "$log"
          }
          run_uml run1.cow proof/run1-first.log
          run_uml run1.cow proof/run1-second.log
          run_uml run2.cow proof/run2-fresh.log
          grep -q 'SENTINEL_BEFORE=ABSENT' proof/run1-first.log
          grep -q 'SENTINEL_BEFORE=written-by-uml' proof/run1-second.log
          grep -q 'SENTINEL_BEFORE=ABSENT' proof/run2-fresh.log
          sha256sum master.img | tee proof/master-after.sha256
          diff -u proof/master-before.sha256 proof/master-after.sha256
          debugfs -R 'cat /baseline.txt' master.img 2>/dev/null | grep -q '^pristine-master$'
          if debugfs -R 'stat /sentinel' master.img 2>&1 | grep -q 'Inode:'; then exit 1; fi
          echo UML_COW_PROOF=PASS | tee proof/result.txt
          printf '%s\n' "$PINNED_COMMIT" > proof/linux-commit.txt
          cp linux-uml master.img run1.cow run2.cow bundle/
          cp -r proof bundle/
          cat > bundle/run-local-proof.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          rm -f local.cow
          timeout 60s ./linux-uml mem=128M ubd0=local.cow,master.img init=/init con=null con0=fd:0,fd:1 | tee local-boot.log
          grep -q UML_TEST_COMPLETE=1 local-boot.log
          grep -q SENTINEL_BEFORE=ABSENT local-boot.log
          echo LOCAL_UML_BOOT=PASS
          EOF
          chmod +x bundle/run-local-proof.sh
          (cd bundle && sha256sum linux-uml master.img run1.cow run2.cow run-local-proof.sh proof/* > SHA256SUMS)
          tar --sort=name --mtime='UTC 2026-08-19' --owner=0 --group=0 --numeric-owner -czf internal-vm-uml-capsule.tar.gz -C bundle .
          sha256sum internal-vm-uml-capsule.tar.gz > capsule.sha256

      - id: upload
        name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-vm-uml-capsule
          path: |
            build.log
            internal-vm-uml-capsule.tar.gz
            capsule.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Checkout staging repository for run pointer
        if: always()
        uses: actions/checkout@v4
        with:
          repository: FreesoSaiFared/torsionfield
          ref: main
          path: torsionfield-repo

      - name: Publish run pointer
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          cd torsionfield-repo
          mkdir -p artifacts/internal-vm-uml
          {
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "BUILD_OUTCOME=${{ steps.build.outcome }}"
            echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
            echo "ARTIFACT_NAME=internal-vm-uml-capsule"
            echo "SOURCE_WORKFLOW_SHA=${GITHUB_SHA}"
            if [ -f ../capsule.sha256 ]; then
              echo -n "CAPSULE_SHA256="
              cut -d' ' -f1 ../capsule.sha256
            else
              echo "CAPSULE_SHA256=ABSENT"
            fi
          } > artifacts/internal-vm-uml/latest-run.txt
          git config user.name 'torsionfield-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/internal-vm-uml/latest-run.txt
          git commit -m "record Internal VM UML staging run ${GITHUB_RUN_ID} (${% raw %}${{ steps.build.outcome }}{% endraw %})" || true
          git push origin HEAD:main

      - name: Preserve build failure as workflow failure
        if: steps.build.outcome != 'success'
        run: exit 1
