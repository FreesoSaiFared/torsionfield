name: stage-htdemucs
on:
  push:
    paths:
      - 'stage/htdemucs-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch pinned official HTDemucs checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          URL='https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/955717e8-8726e21a.th'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o payload/955717e8-8726e21a.th
          printf "models: ['955717e8']\n" > payload/htdemucs.yaml
          sha256sum payload/955717e8-8726e21a.th payload/htdemucs.yaml > payload/SHA256SUMS
          stat -c '%n %s bytes' payload/* | sort > payload/SIZES.txt
          cat > payload/PROVENANCE.json <<'JSON'
          {
            "schema": "SUNO_MODEL_PROVENANCE/1",
            "model": "htdemucs",
            "demucs_signature": "955717e8",
            "source_url": "https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/955717e8-8726e21a.th",
            "registry_evidence": "demucs 4.0.1 packaged remote/files.txt and remote/htdemucs.yaml",
            "staging": "GitHub Actions outside Internal VM",
            "network_inside_vm": false
          }
          JSON
          cat payload/SHA256SUMS
      - name: Upload immutable model payload
        uses: actions/upload-artifact@v4
        with:
          name: htdemucs-955717e8-model-bundle
          path: payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
