name: stage-whisper-cpp-suno
on:
  push:
    paths:
      - '.github/workflows/stage-whisper-cpp-suno.yml'
      - '.github/whisper-cpp-suno-trigger'
  workflow_dispatch:
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build pinned whisper.cpp and multilingual model capsule
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=592feef04a1802b18cbeffd0fd0eb5d02570c2ec
          git clone --recursive https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          cd whisper.cpp
          git checkout "$COMMIT"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$COMMIT"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build build --config Release -j2 --target whisper-cli
          ./models/download-ggml-model.sh base
          mkdir -p ../bundle/bin ../bundle/models ../bundle/source ../bundle/smoke
          cp build/bin/whisper-cli ../bundle/bin/
          cp models/ggml-base.bin ../bundle/models/
          cp LICENSE ../bundle/
          printf '%s\n' "$COMMIT" > ../bundle/WHISPER_CPP_COMMIT
          git submodule status --recursive > ../bundle/SUBMODULES.txt
          tar --exclude='./.git' --exclude='./build' --exclude='./models/ggml-base.bin' -czf ../bundle/source/whisper-cpp-source.tar.gz .
          ./build/bin/whisper-cli -m models/ggml-base.bin -f samples/jfk.wav -otxt -of ../bundle/smoke/jfk > ../bundle/smoke/stdout.txt 2> ../bundle/smoke/stderr.txt
          test -s ../bundle/smoke/jfk.txt
          cd ../bundle
          sha256sum bin/whisper-cli models/ggml-base.bin source/whisper-cpp-source.tar.gz smoke/jfk.txt > SHA256SUMS
          ldd bin/whisper-cli > LDD.txt || true
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('.')
          d={'name':'whisper.cpp SUNO ASR cognition bundle','whisper_cpp_commit':(p/'WHISPER_CPP_COMMIT').read_text().strip(),'model':'ggml-base multilingual','model_sha256':hashlib.sha256((p/'models/ggml-base.bin').read_bytes()).hexdigest(),'binary_sha256':hashlib.sha256((p/'bin/whisper-cli').read_bytes()).hexdigest(),'source_sha256':hashlib.sha256((p/'source/whisper-cpp-source.tar.gz').read_bytes()).hexdigest(),'smoke_transcript':(p/'smoke/jfk.txt').read_text(errors='replace').strip(),'source_mutable':True}
          json.dump(d,open('MANIFEST.json','w'),indent=2)
          PY
          sha256sum MANIFEST.json >> SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-cpp-base-suno-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 30