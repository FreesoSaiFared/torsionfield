name: tmp-av-sam2-deps
on:
  push:
    paths:
      - '.github/workflows/tmp-av-sam2-deps.yml'
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Download SAM2 Python wheels
        run: |
          set -euo pipefail
          mkdir -p artifact/wheels
          python -m pip download --dest artifact/wheels 'hydra-core>=1.3.2' 'iopath>=0.1.10'
          sha256sum artifact/wheels/* > artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: av-sam2-deps
          path: artifact/
          retention-days: 1
          compression-level: 0
